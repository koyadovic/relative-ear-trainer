[project]
name = "relative-ear-trainer"
version = "0.1.0"
description = "A Python Tk desktop app for MIDI relative ear training, scale tensions, interval recognition, chord inversions, and harmonic function practice."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]
keywords = [
  "ear training",
  "relative pitch",
  "relative ear trainer",
  "interval trainer",
  "scale tension ear training",
  "chord ear training",
  "chord inversions",
  "harmonic function",
  "music theory",
  "midi",
  "python",
  "tkinter",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Education",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

[project.urls]
Homepage = "https://github.com/koyadovic/relative-ear-trainer"
Repository = "https://github.com/koyadovic/relative-ear-trainer"
Issues = "https://github.com/koyadovic/relative-ear-trainer/issues"
